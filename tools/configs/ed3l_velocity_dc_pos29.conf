# Generic declarative ED3L velocity fixture with distributed clocks.
# Motion must be safely inhibited before using the cycle command.
#
# slave CONFIG_ID ALIAS POSITION VENDOR_ID PRODUCT_CODE REVISION
slave 1 0 29 0x0000060a 0xed310001 0

# sync CONFIG_ID SLAVE_CONFIG_ID SYNC_INDEX DIRECTION WATCHDOG
sync 10 1 2 output enable
sync 11 1 3 input disable

# pdo CONFIG_ID SYNC_CONFIG_ID PDO_INDEX
pdo 20 10 0x1600
pdo 21 11 0x1a00

# entry CONFIG_ID PDO_CONFIG_ID STABLE_ENTRY_ID INDEX SUBINDEX BIT_LENGTH
entry 100 20 0x604000 0x6040 0 16
entry 101 20 0x60ff00 0x60ff 0 32
entry 102 20 0x608300 0x6083 0 32
entry 103 20 0x608400 0x6084 0 32
entry 104 20 0x60e000 0x60e0 0 16
entry 105 20 0x60e100 0x60e1 0 16
entry 200 21 0x604100 0x6041 0 16
entry 201 21 0x606c00 0x606c 0 32
entry 202 21 0x607700 0x6077 0 16
entry 203 21 0x603f00 0x603f 0 16

# dc CONFIG_ID SLAVE_CONFIG_ID ASSIGN_ACTIVATE SYNC0_CYCLE_NS
#    SYNC0_SHIFT_NS SYNC1_CYCLE_NS SYNC1_SHIFT_NS
dc 300 1 0x0300 1000000 0 0 0

# dc_policy disabled|auto|explicit REFERENCE_SLAVE_CONFIG_ID
dc_policy auto 0
